<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Моя лучшая версия</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff7fb;
    color: #4b3b43;
}

.app {
    max-width: 600px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #d77da5;
    margin-bottom: 5px;
}

.date {
    text-align: center;
    color: #8f7c85;
    margin-bottom: 20px;
}

/* КАРТОЧКИ */

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 5px 20px rgba(150,100,130,.08);
}

/* ПРОГРЕСС */

.progress-title {
    display: flex;
    justify-content: space-between;
    font-weight: 600;
    margin-bottom: 10px;
}

.progress-bar {
    height: 14px;
    background: #f1e5eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#e99abd,#d77da5);
    border-radius: 20px;
    transition: .3s;
}

.last-time {
    margin-top: 9px;
    font-size: 13px;
    color: #96838c;
}

/* НАПОМИНАНИЕ */

.reminder {
    background: #fff0f6;
    border: 1px solid #f4c9da;
    border-radius: 15px;
    padding: 14px;
    margin-top: 15px;
    line-height: 1.5;
}

.reminder.done {
    background: #f0faf4;
    border-color: #c8e8d3;
}

/* ПЕРИОДЫ */

.periods {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
}

.period-button {
    background: #fff;
    border: 2px solid #eadce3;
    border-radius: 16px;
    padding: 14px 8px;
    font-size: 15px;
    cursor: pointer;
}

.period-button.active {
    border-color: #d77da5;
    background: #fff0f6;
}

.period-button.completed {
    border-color: #b9dfc6;
    background: #f2faf5;
}

.period-status {
    display: block;
    font-size: 12px;
    margin-top: 4px;
    color: #96838c;
}

/* ФОРМА */

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
}

input[type="number"],
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #eadce3;
    border-radius: 12px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
}

.checkbox input {
    width: 20px;
    height: 20px;
}

/* КНОПКИ */

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}
