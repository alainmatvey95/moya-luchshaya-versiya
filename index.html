<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d7a8cf">
<link rel="manifest" href="manifest.webmanifest">
<title>Моя лучшая версия</title>

<style>
body{
  margin:0;
  background:#fbf5fa;
  color:#3b3340;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif
}

header{
  padding:28px 20px;
  background:linear-gradient(145deg,#e8c8e4,#f8dce8);
  border-radius:0 0 28px 28px
}

h1{
  margin:0;
  font-size:30px
}

main{
  max-width:620px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 4px 18px #d8c5d433
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

label{
  display:block;
  background:#faf6fa;
  border-radius:14px;
  padding:13px;
  margin:8px 0
}

input[type=range]{
  width:100%
}

input[type=number]{
  width:90px;
  padding:8px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  box-sizing:border-box
}

textarea{
  width:100%;
  min-height:90px;
  border:0;
  border-radius:14px;
  background:#faf6fa;
  padding:12px;
  font:inherit;
  box-sizing:border-box
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:#d7a8cf;
  color:white;
  font-size:16px;
  font-weight:600
}

.progress{
  height:12px;
  background:#eee4ed;
  border-radius:20px;
  overflow:hidden
}

.bar{
  height:100%;
  width:0;
  background:#c58bbd;
  border-radius:20px
}

.stat{
  line-height:1.8
}

.day{
  background:#faf6fa;
  border-radius:14px;
  padding:12px;
  margin:10px 0
}

.entry{
  padding:10px 0;
  border-bottom:1px solid #e8dfe7
}

.entry:last-child{
  border-bottom:0
}

.small{
  color:#8b7d89;
  font-size:13px
}

.success{
  text-align:center;
  color:#9a6793;
  font-weight:600;
  margin:10px 0
}
</style>
</head>

<body>

<header>
<h1>🌸 Моя лучшая версия</h1>
<p>Доброе утро, Алена. Сегодня новый шаг.</p>
</header>

<main>

<section class="card">

<h2>🌿 Сегодня</h2>

<div class="grid">

<label>
😊 Настроение <b id="mv">5</b>/10
<input id="m" type="range" min="1" max="10" value="5">
</label>

<label>
😴 Сон
<input id="s" type="number" min="0" max="24" step=".5" placeholder="часов">
</label>

</div>

<label>
<input id="w" type="checkbox">
💧 Вода
</label>

<label>
<input id="v" type="checkbox">
💊 Витамины
</label>

<label>
<input id="c" type="checkbox">
💄 Уход
</label>

<label>
<input id="f" type="checkbox">
🍎 Питание
</label>

<textarea id="n" placeholder="📝 Мысли дня"></textarea>

<br><br>

<button onclick="save()">
Сохранить запись
</button>

<div id="message"></div>

</section>


<section class="card">

<h2>📊 Прогресс текущей записи</h2>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="pct">0%</p>

</section>


<section class="card">

<h2>📈 Последние 7 дней</h2>

<div id="stats">
Пока нет данных.
</div>

<br>

<button onclick="report()">
📤 Создать отчёт
</button>

</section>

</main>


<script>

const K = "mlv_v2";

const D = () => new Date().toISOString().slice(0,10);

const db = () => {
  try{
    return JSON.parse(localStorage.getItem(K) || "{}");
  }catch(e){
    return {};
  }
};


/* ПЕРЕНОС СТАРЫХ ДАННЫХ */

function migrateOldData(){

  const oldKey = "mlv_v1";
  const old = localStorage.getItem(oldKey);

  if(!old) return;

  try{

    const oldData = JSON.parse(old);
    let current = db();

    Object.keys(oldData).forEach(date => {

      if(!current[date]){
        current[date] = [];
      }

      if(!Array.isArray(current[date])){
        current[date] = [current[date]];
      }

      current[date].push({
        ...oldData[date],
        time:"Старая запись"
      });

    });

    localStorage.setItem(K,JSON.stringify(current));

  }catch(e){
    console.log("Ошибка переноса старых данных",e);
  }
}


/* НАСТРОЙКА НАСТРОЕНИЯ */

m.oninput = () => {
  mv.textContent = m.value;
  updateProgress();
};


/* ПРОГРЕСС */

function updateProgress(){

  const values = [
    w.checked,
    v.checked,
    c.checked,
    f.checked,
    !!n.value.trim(),
    !!s.value
  ];

  const done = values.filter(Boolean).length;

  const percent = Math.round(done / values.length * 100);

  bar.style.width = percent + "%";
  pct.textContent = percent + "%";
}


/* ОЧИСТКА ФОРМЫ */

function clearForm(){

  m.value = 5;
  mv.textContent = 5;

  s.value = "";

  w.checked = false;
  v.checked = false;
  c.checked = false;
  f.checked = false;

  n.value = "";

  updateProgress();
}


/* СОХРАНЕНИЕ */

function save(){

  let data = db();
  const date = D();

  if(!data[date]){
    data[date] = [];
  }

  if(!Array.isArray(data[date])){
    data[date] = [data[date]];
  }

  const entry = {

    time:new Date().toLocaleTimeString("ru-RU",{
      hour:"2-digit",
      minute:"2-digit"
    }),

    m:+m.value,

    s:+s.value || 0,

    w:w.checked,

    v:v.checked,

    c:c.checked,

    f:f.checked,

    n:n.value.trim()

  };

  data[date].push(entry);

  localStorage.setItem(K,JSON.stringify(data));

  render();

  clearForm();

  message.innerHTML =
    '<div class="success">🌸 Запись сохранена. Форма очищена — можно продолжать день.</div>';

  setTimeout(()=>{
    message.innerHTML="";
  },3000);

}


/* СТАТИСТИКА */

function render(){

  const data = db();

  const dates = Object.keys(data)
    .sort()
    .slice(-7);

  if(!dates.length){

    stats.innerHTML="Пока нет данных.";

    return;
  }

  let totalMood = 0;
  let moodCount = 0;

  let water = 0;
  let vitamins = 0;
  let care = 0;
  let food = 0;
  let sleep = 0;
  let sleepCount = 0;
  let entries = 0;

  dates.forEach(date=>{

    let day = data[date];

    if(!Array.isArray(day)){
      day = [day];
    }

    day.forEach(q=>{

      entries++;

      totalMood += Number(q.m) || 0;
      moodCount++;

      if(q.w) water++;
      if(q.v) vitamins++;
      if(q.c) care++;
      if(q.f) food++;

      if(q.s){
        sleep += Number(q.s);
        sleepCount++;
      }

    });

  });

  const averageMood =
    moodCount
    ? (totalMood/moodCount).toFixed(1)
    : "0";

  const averageSleep =
    sleepCount
    ? (sleep/sleepCount).toFixed(1)
    : "0";

  stats.innerHTML = `

    😊 Среднее настроение:
    <b>${averageMood}/10</b>
    <br>

    😴 Средний сон:
    <b>${averageSleep} ч</b>
    <br>

    💧 Вода:
    <b>${water}</b>
    раз
    <br>

    💊 Витамины:
    <b>${vitamins}</b>
    раз
    <br>

    💄 Уход:
    <b>${care}</b>
    раз
    <br>

    🍎 Питание:
    <b>${food}</b>
    раз
    <br>

    📝 Сохранено записей:
    <b>${entries}</b>

  `;

}


/* ОТЧЁТ */

function report(){

  const data = db();

  const dates = Object.keys(data)
    .sort()
    .slice(-7);

  if(!dates.length){

    alert("Сначала сохрани хотя бы одну запись.");

    return;
  }

  let text =
`🌸 Моя лучшая версия — отчёт

${dates[0]} — ${dates[dates.length-1]}

`;

  dates.forEach(date=>{

    let day = data[date];

    if(!Array.isArray(day)){
      day = [day];
    }

    text += `\n📅 ${date}\n`;

    day.forEach((q,index)=>{

      text += `\nЗапись ${index+1}`;

      if(q.time){
        text += ` — ${q.time}`;
      }

      text += `\n😊 Настроение: ${q.m}/10`;
      text += `\n😴 Сон: ${q.s || "—"} ч`;
      text += `\n💧 Вода: ${q.w ? "✓" : "—"}`;
      text += `\n💊 Витамины: ${q.v ? "✓" : "—"}`;
      text += `\n💄 Уход: ${q.c ? "✓" : "—"}`;
      text += `\n🍎 Питание: ${q.f ? "✓" : "—"}`;

      if(q.n){
        text += `\n📝 ${q.n}`;
      }

      text += "\n";

    });

    text += "\n--------------------\n";

  });


  if(navigator.share){

    navigator.share({
      title:"Моя лучшая версия",
      text:text
    });

  }else{

    alert(text);

  }

}


/* ЗАПУСК */

migrateOldData();

render();

updateProgress();

</script>

</body>
</html>
