<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d7a8cf"><link rel="manifest" href="manifest.webmanifest"><title>Моя лучшая версия</title><style>body{margin:0;background:#fbf5fa;color:#3b3340;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:28px 20px;background:linear-gradient(145deg,#e8c8e4,#f8dce8);border-radius:0 0 28px 28px}h1{margin:0;font-size:30px}main{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #d8c5d433}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;background:#faf6fa;border-radius:14px;padding:13px;margin:8px 0}input[type=range]{width:100%}textarea{width:100%;min-height:90px;border:0;border-radius:14px;background:#faf6fa;padding:12px;font:inherit;box-sizing:border-box}button{width:100%;border:0;border-radius:14px;padding:14px;background:#d7a8cf;color:white;font-size:16px;font-weight:600}.progress{height:12px;background:#eee4ed;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#c58bbd;border-radius:20px}.stat{line-height:1.8}</style></head><body><header><h1>🌸 Моя лучшая версия</h1><p>Доброе утро, Алена. Сегодня новый шаг.</p></header><main><section class="card"><h2>🌿 Сегодня</h2><div class="grid"><label>😊 Настроение <b id="mv">5</b>/10<input id="m" type="range" min="1" max="10" value="5"></label><label>😴 Сон<input id="s" type="number" min="0" max="24" step=".5" placeholder="часов"></label></div><label><input id="w" type="checkbox"> 💧 Вода</label><label><input id="v" type="checkbox"> 💊 Витамины</label><label><input id="c" type="checkbox"> 💄 Уход</label><label><input id="f" type="checkbox"> 🍎 Питание</label><textarea id="n" placeholder="📝 Мысли дня"></textarea><br><br><button onclick="save()">Сохранить день</button></section><section class="card"><h2>📊 Прогресс дня</h2><div class="progress"><div class="bar" id="bar"></div></div><p id="pct">0%</p></section><section class="card"><h2>📈 Последние 7 дней</h2><div id="stats" class="stat">Пока нет данных.</div><br><button onclick="report()">📤 Создать отчёт</button></section></main><script>const K="mlv_v1",D=()=>new Date().toISOString().slice(0,10),db=()=>JSON.parse(localStorage.getItem(K)||"{}");m.oninput=()=>mv.textContent=m.value;function save(){let x=db(),d=D();x[d]={m:+m.value,s:+s.value||0,w:w.checked,v:v.checked,c:c.checked,f:f.checked,n:n.value};localStorage.setItem(K,JSON.stringify(x));render();alert("🌸 День сохранён")}function render(){let x=db(),d=x[D()];if(d){m.value=d.m;mv.textContent=d.m;s.value=d.s;w.checked=d.w;v.checked=d.v;c.checked=d.c;f.checked=d.f;n.value=d.n||""}let done=d?[d.w,d.v,d.c,d.f,!!d.n].filter(Boolean).length:0;bar.style.width=done*20+"%";pct.textContent=done*20+"%";let ks=Object.keys(x).sort().slice(-7);if(!ks.length)return;let a=[0,0,0,0,0];ks.forEach(k=>{let q=x[k];a[0]+=q.m;a[1]+=q.w;a[2]+=q.v;a[3]+=q.c;a[4]+=q.f});stats.innerHTML=`😊 Среднее настроение: <b>${(a[0]/ks.length).toFixed(1)}/10</b><br>💧 Вода: ${a[1]}/${ks.length}<br>💊 Витамины: ${a[2]}/${ks.length}<br>💄 Уход: ${a[3]}/${ks.length}<br>🍎 Питание: ${a[4]}/${ks.length}`}function report(){let x=db(),ks=Object.keys(x).sort().slice(-7);if(!ks.length)return alert("Сначала сохрани день.");let a=[0,0,0,0,0];ks.forEach(k=>{let q=x[k];a[0]+=q.m;a[1]+=q.w;a[2]+=q.v;a[3]+=q.c;a[4]+=q.f});let t=`🌸 Моя лучшая версия — отчёт\n${ks[0]} — ${ks.at(-1)}\n\n😊 Настроение: ${(a[0]/ks.length).toFixed(1)}/10\n💧 Вода: ${a[1]}/${ks.length}\n💊 Витамины: ${a[2]}/${ks.length}\n💄 Уход: ${a[3]}/${ks.length}\n🍎 Питание: ${a[4]}/${ks.length}`;navigator.share?navigator.share({title:"Моя лучшая версия",text:t}):alert(t)}render()</script></body></html>
